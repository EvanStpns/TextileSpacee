    // ==========================================
    // 2. COLOR & MATCHING UTILITIES
    // ==========================================
    function normalizeHex(input) {
      if (!input) return null;
      let clean = input.trim().replace(/^#/, '');
      if (/^[0-9A-Fa-f]{3}$/.test(clean)) {
        clean = clean.split('').map((c) => c + c).join('');
      }
      if (/^[0-9A-Fa-f]{6}$/.test(clean)) {
        return '#' + clean.toUpperCase();
      }
      return null;
    }

    function hexToRgb(hex) {
      const norm = normalizeHex(hex) || '#000000';
      const num = parseInt(norm.slice(1), 16);
      return {
        r: (num >> 16) & 255,
        g: (num >> 8) & 255,
        b: num & 255
      };
    }

    function rgbToHex(r, g, b) {
      const clamp = (n) => Math.max(0, Math.min(255, Math.round(n)));
      return (
        '#' +
        [clamp(r), clamp(g), clamp(b)]
          .map((x) => x.toString(16).padStart(2, '0').toUpperCase())
          .join('')
      );
    }

    // Euclidean distance in RGB space (max ~ 441.67) -> converted to similarity %
    function calculateColorMatch(hexA, hexB) {
      const a = hexToRgb(hexA);
      const b = hexToRgb(hexB);
      const dr = a.r - b.r;
      const dg = a.g - b.g;
      const db = a.b - b.b;
      const distance = Math.sqrt(dr * dr + dg * dg + db * db);
      const maxDist = Math.sqrt(255 * 255 * 3);
      const similarity = Math.max(0, Math.min(100, ((1 - distance / maxDist) * 100)));
      return {
        distance: Number(distance.toFixed(1)),
        similarity: Number(similarity.toFixed(1)),
        isExact: distance === 0
      };
    }

    function getContrastTextColor(hex) {
      const { r, g, b } = hexToRgb(hex);
      // Relative luminance
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return luminance > 0.55 ? '#0f172a' : '#ffffff';
    }

    function formatRupiah(amount) {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',

    function showToast(message, type = 'info') {
      state.toastMessage = message;
      state.toastType = type;
      render();
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {

        render();
      }, 4200);
    }

    // ==========================================
    // 3. DYE-LOT & CART / POS LOGIC
    // ==========================================
    function getCartDyeLotConflicts() {
      // Group roll items by fabric name to see if multiple dye lots of same fabric are mixed
      const byFabric = {};
      state.cart
        .filter((c) => c.type === 'roll')
        .forEach((item) => {
          const baseName = item.name.trim().toLowerCase();
          if (!byFabric[baseName]) byFabric[baseName] = new Set();
          byFabric[baseName].add(item.dyeLot);
        });

      const warnings = [];
      Object.entries(byFabric).forEach(([fabricKey, lotsSet]) => {
        if (lotsSet.size > 1) {
          warnings.push({
            fabric: fabricKey,
            lots: Array.from(lotsSet)
          });
        }
      });
      return warnings;
    }

    function addRollToCart(rollId, meters) {
      const roll = state.rolls.find((r) => r.id === rollId);
      if (!roll) return;
      const qty = parseFloat(meters);
      if (isNaN(qty) || qty <= 0) {
        showToast('Masukkan panjang kain (meter) yang valid.', 'warn');
        return;
      }
      if (qty > roll.stockMeters) {
        showToast(`Stok ${roll.name} (${roll.dyeLot}) hanya tersisa ${roll.stockMeters.toFixed(2)} m.`, 'warn');
        return;
      }

      const existingIdx = state.cart.findIndex(
        (c) => c.type === 'roll' && c.itemId === roll.id
      );
      if (existingIdx >= 0) {
        const newTotalMeters = Number((state.cart[existingIdx].meters + qty).toFixed(2));
        if (newTotalMeters > roll.stockMeters) {
          showToast(`Total di keranjang (${newTotalMeters}m) melebihi stok ${roll.stockMeters.toFixed(2)}m.`, 'warn');
          return;
        }
        state.cart[existingIdx].meters = newTotalMeters;
        state.cart[existingIdx].subtotal = Math.round(newTotalMeters * roll.pricePerMeter);
      } else {
        state.cart.push({
          type: 'roll',
          itemId: roll.id,
          name: roll.name,
          hex: roll.hex,
          dyeLot: roll.dyeLot,
          shelf: roll.shelf,
          meters: Number(qty.toFixed(2)),
          unitPrice: roll.pricePerMeter,
          subtotal: Math.round(qty * roll.pricePerMeter)
        });
      }

      const conflicts = getCartDyeLotConflicts();
      if (conflicts.length > 0) {
        showToast(
          `Peringatan Dye-Lot: Ada campuran batch (${conflicts[0].lots.join(' & ')}) untuk kain yang sama!`,
          'warn'
        );
      } else {
        showToast(`Ditambahkan ${qty}m ${roll.name} (${roll.dyeLot}) ke stasiun kasir.`, 'success');
      }
      render();
    }

    function addScrapToCart(scrapId) {
      const scrap = state.scraps.find((s) => s.id === scrapId);
      if (!scrap) return;
      if (state.cart.some((c) => c.type === 'scrap' && c.itemId === scrap.id)) {
        showToast('Potongan kain upcycling ini sudah ada di keranjang.', 'info');
        return;
      }
      state.cart.push({
        type: 'scrap',
        itemId: scrap.id,
        name: scrap.name,
        hex: scrap.hex,
        dyeLot: scrap.dyeLot,
        shelf: scrap.shelf,
        meters: scrap.lengthMeters,
        unitPrice: scrap.priceTotal,
        subtotal: scrap.priceTotal
      });
      showToast(`Potongan upcycling ${scrap.name} (${scrap.lengthMeters}m) masuk ke keranjang.`, 'success');
      render();
    }

    function removeFromCart(index) {
      state.cart.splice(index, 1);
      render();
    }

    function executeCuttingAndCheckout() {
      if (state.cart.length === 0) {
        showToast('Keranjang workstation masih kosong.', 'warn');
        return;
      }

      let generatedScrapsCount = 0;
      const totalAmount = state.cart.reduce((sum, item) => sum + item.subtotal, 0);

      state.cart.forEach((cartItem) => {
        if (cartItem.type === 'roll') {
          const roll = state.rolls.find((r) => r.id === cartItem.itemId);
          if (roll) {
            const remaining = Number((roll.stockMeters - cartItem.meters).toFixed(2));
            roll.stockMeters = Math.max(0, remaining);

            // Auto-generate Zero-Waste Scrap if remaining stock is > 0 and below threshold (e.g., < 1.5m)
            if (roll.stockMeters > 0 && roll.stockMeters < state.autoScrapThreshold) {
              const scrapMeters = roll.stockMeters;
              const scrapPrice = Math.round(scrapMeters * roll.pricePerMeter * 0.65); // 35% discount for upcycling
              state.scraps.unshift({
                id: 'SCRAP-' + Math.floor(200 + Math.random() * 799),
                sourceRollId: roll.id,
                name: `Sisa Potongan ${roll.name}`,
                hex: roll.hex,
                colorName: roll.colorName,
                dyeLot: roll.dyeLot,
                shelf: 'Bin Scrap Auto-WMS',
                lengthMeters: scrapMeters,
                priceTotal: scrapPrice,
                craftIdea: 'Sisa rol otomatis dari meja potong untuk proyek kerajinan / upcycling'
              });
              roll.stockMeters = 0;
              generatedScrapsCount++;
            }
          }
        } else if (cartItem.type === 'scrap') {
          state.scraps = state.scraps.filter((s) => s.id !== cartItem.itemId);
        }
      });

      const txRecord = {
        id: 'TRX-' + Date.now().toString().slice(-6),
        time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
        itemsCount: state.cart.length,
        total: totalAmount,
        dyeLotWarnings: getCartDyeLotConflicts().length
      };

      state.transactions.unshift(txRecord);
      state.cart = [];

      const scrapMsg =
        generatedScrapsCount > 0
          ? ` ${generatedScrapsCount} sisa rol (<${state.autoScrapThreshold}m) otomatis masuk ke Katalog Zero-Waste!`
          : '';
      showToast(`Transaksi ${txRecord.id} (${formatRupiah(totalAmount)}) berhasil diproses.${scrapMsg}`, 'success');
      render();
    }

    // ==========================================
    // 4. EVENT HANDLERS & PHOTO EYEDROPPER
    // ==========================================
    function handlePhotoUploadAndPick(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        state.uploadedPhotoUrl = e.target.result;
        render();
      };
      reader.readAsDataURL(file);
    }

    function handleCanvasSampleClick(event) {
      const imgEl = document.getElementById('samplePhotoPreview');
      if (!imgEl || !imgEl.complete) return;

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = imgEl.naturalWidth || imgEl.width;
      canvas.height = imgEl.naturalHeight || imgEl.height;
      ctx.drawImage(imgEl, 0, 0, canvas.width, canvas.height);

      const rect = imgEl.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = Math.floor((event.clientX - rect.left) * scaleX);
      const y = Math.floor((event.clientY - rect.top) * scaleY);

      try {
        const pixel = ctx.getImageData(x, y, 1, 1).data;
        const pickedHex = rgbToHex(pixel[0], pixel[1], pixel[2]);
        state.targetHex = pickedHex;
        state.hexInputText = pickedHex;
        showToast(`Warna sampel terdeteksi dari foto: ${pickedHex}`, 'success');
        render();
      } catch (err) {
        showToast('Tidak dapat membaca piksel gambar ini.', 'warn');
      }
    }

      // Similarity filter toggle
      const simFilterBtn = document.getElementById('similarityFilterBtn');

      // Add Scrap to Cart

      // Workstation Quick Cut Form
      const wsRollSelect = document.getElementById('wsRollSelect');

        wsRollSelect.addEventListener('change', (e) => {
          state.selectedRollForCut = e.target.value;
          render();

      const wsMetersInput = document.getElementById('wsMetersInput');
      if (wsMetersInput) {
        wsMetersInput.addEventListener('input', (e) => {
          state.cutMetersInput = parseFloat(e.target.value) || 0;
          render();
          const el = document.getElementById('wsMetersInput');
          if (el) el.focus();

      const wsThresholdSelect = document.getElementById('wsThresholdSelect');
      if (wsThresholdSelect) {
        wsThresholdSelect.addEventListener('change', (e) => {
          state.autoScrapThreshold = parseFloat(e.target.value);
          render();
        });
      }

      const wsAddCutBtn = document.getElementById('wsAddCutBtn');
      if (wsAddCutBtn) {
        wsAddCutBtn.addEventListener('click', () => {
          addRollToCart(state.selectedRollForCut, state.cutMetersInput);
        });
      }

      // Remove cart item
      document.querySelectorAll('[data-remove-cart]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.getAttribute('data-remove-cart'), 10);
          removeFromCart(idx);
        });
      });

      // Checkout button
      const checkoutBtn = document.getElementById('checkoutBtn');
      if (checkoutBtn) {
        checkoutBtn.addEventListener('click', executeCuttingAndCheckout);
      }
    }

            `
              : `
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                ${state.scraps
                  .map(
                    (scrap) => `
                  <article class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col justify-between">
                    <div>
                      <div class="h-20 w-full swatch-pattern flex items-center justify-between px-4" style="background-color: ${scrap.hex};">
                        <span class="px-2.5 py-1 rounded-lg text-xs font-mono font-bold bg-white/90 text-slate-900">
                          ${scrap.hex}
                        </span>
                        <span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-amber-400 text-slate-950">
                          Panjang ${scrap.lengthMeters.toFixed(2)} m
                        </span>
                      </div>
                      <div class="p-4 space-y-2.5">
                        <div class="flex items-start justify-between gap-2">
                          <div>
                            <span class="text-[11px] font-mono text-slate-400">${scrap.id} • ${scrap.dyeLot}</span>
                            <h3 class="font-bold text-slate-900 text-base">${scrap.name}</h3>
                          </div>
                          <div class="text-right">
                            <div class="text-base font-extrabold text-accent-600">${formatRupiah(scrap.priceTotal)}</div>
                            <div class="text-[11px] text-slate-500">Harga Paket Hemat</div>
                          </div>
                        </div>
                        <p class="text-xs text-slate-600 bg-slate-50 p-2.5 rounded-xl border border-slate-200/70">
                          <strong>Ide Upcycling:</strong> ${scrap.craftIdea}
                        </p>
                        <div class="text-xs text-slate-500 flex items-center justify-between">
                          <span>Lokasi: <strong class="text-slate-700">${scrap.shelf}</strong></span>
                          <span>Warna: <strong class="text-slate-700">${scrap.colorName}</strong></span>
                        </div>
                      </div>
                    </div>
                    <div class="px-4 pb-4">
                      <button
                        type="button"
                        data-add-scrap="${scrap.id}"
                        class="w-full py-2.5 px-4 rounded-xl text-xs font-bold bg-slate-900 hover:bg-slate-800 text-white transition"
                      >
                        + Ambil Potongan Upcycling ke POS
                      </button>
                    </div>
                  </article>
                `
                  )
                  .join('')}
              </div>
            `
          }
        </section>
      `;
    }

    function renderWorkstationDrawer() {
      if (!state.workstationOpen) return '';

      const selectedRoll = state.rolls.find((r) => r.id === state.selectedRollForCut) || state.rolls[0];
      const previewMeters = Math.max(0, parseFloat(state.cutMetersInput) || 0);
      const previewRemaining = Math.max(0, Number((selectedRoll.stockMeters - previewMeters).toFixed(2)));
      const willGenerateScrap =
        previewMeters > 0 &&
        previewMeters <= selectedRoll.stockMeters &&
        previewRemaining > 0 &&
        previewRemaining < state.autoScrapThreshold;

      const cartTotal = state.cart.reduce((sum, i) => sum + i.subtotal, 0);
      const dyeWarnings = getCartDyeLotConflicts();

      return `
        <div class="fixed inset-0 z-40 flex justify-end bg-slate-950/40 backdrop-blur-[2px]">
          <aside class="w-full max-w-lg bg-white h-full shadow-2xl border-l border-slate-200 flex flex-col justify-between overflow-hidden">
            <!-- Drawer Header -->
            <div class="px-5 py-4 border-b border-slate-200 bg-brand-900 text-white flex items-center justify-between">
              <div>
                <div class="text-[11px] uppercase tracking-wider text-brand-100 font-semibold">
                  Hardware-Integrated Workstation
                </div>
                <h2 class="text-base sm:text-lg font-bold">Simulator Meja Potong & Kasir (POS)</h2>
              </div>
              <button
                type="button"
                data-toggle-workstation
                aria-label="Tutup Workstation"
                class="p-2 rounded-xl hover:bg-white/10 transition"
              >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>

            <!-- Drawer Body -->
            <div class="p-5 overflow-y-auto space-y-5 flex-1">
              <!-- Quick Cutting Calculator -->
              <div class="rounded-2xl bg-slate-50 border border-slate-200 p-4 space-y-3">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-bold uppercase tracking-wider text-brand-700">Kalkulator Potong Kain</span>
                  <span class="text-[11px] text-slate-500">Stasiun Terpadu (1 Layar POS)</span>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                  <div class="sm:col-span-2">
                    <label for="wsRollSelect" class="block text-[11px] font-semibold text-slate-600 mb-1">Pilih Rol Kain & Dye-Lot</label>
                    <select id="wsRollSelect" class="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-xs font-medium">
                      ${state.rolls
                        .map(
                          (r) => `
                        <option value="${r.id}" ${r.id === selectedRoll.id ? 'selected' : ''}>
                          ${r.name} • ${r.dyeLot} (${r.stockMeters.toFixed(1)}m)
                        </option>
                      `
                        )
                        .join('')}
                    </select>
                  </div>
                  <div>
                    <label for="wsMetersInput" class="block text-[11px] font-semibold text-slate-600 mb-1">Panjang (m)</label>
                    <input
                      id="wsMetersInput"
                      type="number"
                      step="0.25"
                      min="0.25"
                      value="${state.cutMetersInput}"
                      class="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-xs font-mono font-bold"
                    />
                  </div>
                </div>

                <div class="flex flex-wrap items-center justify-between gap-2 text-xs bg-white p-2.5 rounded-xl border border-slate-200/80">
                  <div>
                    <span class="text-slate-500">Estimasi Sisa Rol:</span>
                    <strong class="font-mono text-slate-900 ml-1">${previewRemaining.toFixed(2)} m</strong>
                  </div>
                  <div>
                    <span class="text-slate-500">Estimasi Biaya:</span>
                    <strong class="text-brand-700 ml-1">${formatRupiah(previewMeters * selectedRoll.pricePerMeter)}</strong>
                  </div>
                </div>

                ${
                  willGenerateScrap
                    ? `
                  <div class="text-[11px] bg-amber-50 border border-amber-200 text-amber-900 px-3 py-2 rounded-xl">
                    Sisa rol (${previewRemaining.toFixed(2)}m) di bawah ambang batas <span class="font-mono font-bold">${state.autoScrapThreshold}m</span>: saat checkout akan otomatis masuk ke <strong>Katalog Zero-Waste Scrap</strong>.
                  </div>
                `
                    : ''
                }

                <div class="flex items-center justify-between gap-2 pt-1">
                  <label class="flex items-center gap-1.5 text-[11px] text-slate-600">
                    <span>Ambang Scrap:</span>
                    <select id="wsThresholdSelect" class="px-2 py-1 rounded-lg border border-slate-300 bg-white font-mono text-xs">
                      <option value="1.0" ${state.autoScrapThreshold === 1.0 ? 'selected' : ''}>1.0m</option>
                      <option value="1.5" ${state.autoScrapThreshold === 1.5 ? 'selected' : ''}>1.5m</option>
                      <option value="2.0" ${state.autoScrapThreshold === 2.0 ? 'selected' : ''}>2.0m</option>
                    </select>
                  </label>

                  <button
                    id="wsAddCutBtn"
                    type="button"
                    class="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold transition"
                  >
                    + Tambah Potongan
                  </button>
                </div>
              </div>

              <!-- Dye-Lot Conflict Alert inside Drawer -->
              ${
                dyeWarnings.length > 0
                  ? `
                <div class="rounded-xl bg-rose-50 border border-rose-200 p-3 text-xs text-rose-900">
                  <strong>Perhatian Dye-Lot:</strong> Terdeteksi lebih dari satu batch (${dyeWarnings[0].lots.join(', ')}) untuk kain <strong>${dyeWarnings[0].fabric}</strong> dalam pesanan ini.
                </div>
              `
                  : ''
              }

              <!-- Active Cart / Order List -->
              <div class="space-y-2.5">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500">
                  Daftar Potongan & Item Transaksi (${state.cart.length})
                </h3>

                ${
                  state.cart.length === 0
                    ? `<div class="rounded-xl border border-dashed border-slate-300 p-6 text-center text-xs text-slate-500">
                        Belum ada item di meja potong. Pilih kain dari katalog atau gunakan kalkulator potong di atas.
                      </div>`
                    : state.cart
                        .map(
                          (item, idx) => `
                      <div class="flex items-center justify-between gap-3 p-3 rounded-xl border border-slate-200 bg-white">
                        <div class="flex items-center gap-3 min-w-0">
                          <span class="w-8 h-8 rounded-lg shrink-0 border border-black/15" style="background-color: ${item.hex};"></span>
                          <div class="min-w-0">
                            <div class="text-xs font-bold text-slate-900 truncate">${item.name}</div>
                            <div class="text-[11px] font-mono text-slate-500">
                              ${item.meters}m • ${item.dyeLot} • ${item.shelf}
                            </div>
                          </div>
                        </div>
                        <div class="flex items-center gap-2.5 shrink-0">
                          <span class="text-xs font-extrabold text-slate-800">${formatRupiah(item.subtotal)}</span>
                          <button
                            type="button"
                            data-remove-cart="${idx}"
                            class="p-1.5 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition"
                            aria-label="Hapus item"
                          >
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                          </button>
                        </div>
                      </div>
                    `
                        )
                        .join('')
                }
              </div>

              <!-- Recent Transactions Log -->
              ${
                state.transactions.length > 0
                  ? `
                <div class="space-y-2 pt-2 border-t border-slate-200">
                  <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500">Riwayat Transaksi POS Sesi Ini</h3>
                  <div class="space-y-1.5">
                    ${state.transactions
                      .map(
                        (trx) => `
                      <div class="flex items-center justify-between text-xs bg-slate-50 px-3 py-2 rounded-xl border border-slate-200/70">
                        <div>
                          <span class="font-mono font-bold text-slate-800">${trx.id}</span>
                          <span class="text-slate-500 ml-1.5">(${trx.time} • ${trx.itemsCount} item)</span>
                        </div>
                        <span class="font-bold text-emerald-700">${formatRupiah(trx.total)}</span>
                      </div>
                    `
                      )
                      .join('')}
                  </div>
                </div>
              `
                  : ''
              }
            </div>

            <!-- Drawer Footer Checkout -->
            <div class="p-4 border-t border-slate-200 bg-slate-50 space-y-3">
              <div class="flex items-center justify-between">
                <span class="text-sm font-semibold text-slate-700">Total Tagihan POS</span>
                <span class="text-xl font-extrabold text-brand-700">${formatRupiah(cartTotal)}</span>
              </div>
              <button
                id="checkoutBtn"
                type="button"
                class="w-full py-3 px-4 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm shadow-sm transition"
              >
                Selesaikan Potong & Pembayaran (Update WMS)
              </button>
            </div>
          </aside>
        </div>
      `;
    }

    function renderToast() {
      if (!state.toastMessage) return '';
      const colorMap = {
        success: 'bg-emerald-900 text-white border-emerald-700',
        warn: 'bg-amber-900 text-white border-amber-700',
        info: 'bg-slate-900 text-white border-slate-700'
      };
      return `
        <div class="fixed bottom-4 left-4 right-4 sm:left-auto sm:right-6 z-50 max-w-md ml-auto">
          <div class="rounded-2xl border px-4 py-3 shadow-xl text-xs sm:text-sm font-medium ${colorMap[state.toastType] || colorMap.info}">
            ${state.toastMessage}
          </div>
        </div>
      `;
    }

    function render() {
      const root = document.getElementById('app');
      if (!root) return;

      root.innerHTML = `
        ${renderHeader()}
        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
          ${state.activeTab === 'catalog' ? renderHexMatcherPanel() : ''}
          ${state.activeTab === 'catalog' ? renderFabricCatalog() : renderZeroWasteScrapCatalog()}
        </main>
        <footer class="bg-white border-t border-slate-200 py-5 mt-8">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-slate-500">
            <div>
              <strong class="text-slate-700">TextileSpace Prototype</strong> — Ritel Tekstil Terintegrasi HEX Color Matching, Dye-Lot Indexing & Zero-Waste WMS.
            </div>
            <div>Dibuat untuk simulasi operasional toko kain modern & inklusif.</div>
          </div>
        </footer>
        ${renderWorkstationDrawer()}
        ${renderToast()}
      `;

      attachEvents();
    }

    // Initialize application
    render();
  </script>
</body>
</html>
